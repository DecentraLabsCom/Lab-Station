name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild"
        required: true

permissions:
  actions: read
  contents: write

env:
  AHK_VERSION: "2.0.27"
  AHK2EXE_VERSION: "Ahk2Exe1.1.37.02a2"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Resolve release ref
        id: release_meta
        shell: powershell
        run: |
          $event = "${{ github.event_name }}"
          $refType = "${{ github.ref_type }}"
          $ref = "${{ github.ref }}"
          $tag = "${{ github.ref_name }}"

          if ($event -eq "workflow_dispatch") {
            $inputTag = "${{ inputs.tag }}".Trim()
            if ([string]::IsNullOrWhiteSpace($inputTag)) {
              throw 'workflow_dispatch requires the "tag" input'
            }
            $tag = $inputTag
            $ref = "refs/tags/$inputTag"
          } elseif ($refType -ne "tag") {
            throw "Release workflow must run from a tag ref (current: $ref)"
          }

          "ref=$ref" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_meta.outputs.ref }}

      - name: Setup portable AutoHotkey v2 + Ahk2Exe
        id: setup-tools
        shell: powershell
        run: |
          $headers = @{
            'User-Agent' = 'Lab-Station-Release'
          }

          # Use portable toolchain to avoid installer hangs on GitHub runners.
          $ahkVersion = $Env:AHK_VERSION
          $ahk2ExeVersion = $Env:AHK2EXE_VERSION
          $ahkZip = 'AutoHotkey.zip'
          $ahkDir = 'AutoHotkey'
          $ahkUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$ahkVersion/AutoHotkey_${ahkVersion}.zip"
          Write-Host "Downloading AutoHotkey v$ahkVersion from $ahkUrl"
          Invoke-WebRequest -Uri $ahkUrl -OutFile $ahkZip -Headers $headers
          Expand-Archive -Path $ahkZip -DestinationPath $ahkDir -Force

          $compilerZip = 'Ahk2Exe.zip'
          $compilerDir = 'Ahk2Exe'
          $compilerUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/$ahk2ExeVersion/${ahk2ExeVersion}.zip"
          Write-Host "Downloading Ahk2Exe $ahk2ExeVersion from $compilerUrl"
          Invoke-WebRequest -Uri $compilerUrl -OutFile $compilerZip -Headers $headers
          Expand-Archive -Path $compilerZip -DestinationPath $compilerDir -Force

          $compiler = Get-ChildItem -Path $compilerDir -Filter 'Ahk2Exe.exe' -Recurse -File | Select-Object -ExpandProperty FullName -First 1
          $base = (Resolve-Path (Join-Path $ahkDir 'AutoHotkey64.exe')).Path

          if (-not $compiler -or -not (Test-Path $compiler)) {
            throw "Ahk2Exe compiler not found in $compilerDir"
          }

          if (-not (Test-Path $base)) {
            throw "AutoHotkey64.exe not found at $base"
          }
          
          Write-Host "Compiler: $compiler"
          Write-Host "Base: $base"
          "compiler=$compiler" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "autohotkey_base=$base" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Compile AppControl
        shell: powershell
        run: |
          $compiler = "${{ steps.setup-tools.outputs.compiler }}"
          if (-not $compiler -or -not (Test-Path $compiler)) {
            throw "Ahk2Exe compiler path missing: $compiler"
          }
          $base = "${{ steps.setup-tools.outputs.autohotkey_base }}"
          if (-not $base -or -not (Test-Path $base)) {
            throw "AutoHotkey base path missing: $base"
          }

          $scriptPath = (Resolve-Path 'controller/AppControl.ahk').Path
          $outDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outFile = Join-Path $outDir 'AppControl.exe'
          $iconPath = (Resolve-Path 'img/favicon.ico').Path
          Write-Host "Compiler: $compiler"
          Write-Host "Base: $base"
          Write-Host "Icon: $iconPath"
          Write-Host "Script: $scriptPath"
          Write-Host "Output: $outFile"
          
          # Verify script exists and is readable
          if (-not (Test-Path $scriptPath)) {
            throw "Script not found: $scriptPath"
          }
          Write-Host "Script verified, size: $((Get-Item $scriptPath).Length) bytes"
          
          # Verify include files exist for LabStation
          if ($scriptPath -like "*LabStation.ahk") {
            Write-Host "Checking LabStation includes..."
            $scriptDir = Split-Path -Parent $scriptPath
            $includes = @(
              "core\Config.ahk", "core\Logger.ahk", "core\Admin.ahk", "core\Shell.ahk", "core\Json.ahk",
              "system\RegistryManager.ahk", "system\WakeOnLan.ahk", "system\Autostart.ahk",
              "system\AccountManager.ahk", "system\EnergyAudit.ahk", "system\PowerManager.ahk",
              "system\ServiceManager.ahk", "service\SessionManager.ahk", "service\SessionGuard.ahk",
              "service\Telemetry.ahk", "service\Recovery.ahk", "diagnostics\Status.ahk",
              "service\CommandQueue.ahk", "setup\Wizard.ahk", "ui\Tray.ahk"
            )
            foreach ($inc in $includes) {
              $incPath = Join-Path $scriptDir $inc
              if (-not (Test-Path $incPath)) {
                throw "Missing include file: $incPath"
              }
            }
            Write-Host "All include files verified"
          }
          
          # Change to script directory for compilation (required for relative includes)
          $scriptDir = Split-Path -Parent $scriptPath
          $scriptName = Split-Path -Leaf $scriptPath
          Push-Location $scriptDir
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Files in current directory:"
          Get-ChildItem | Select-Object -First 10 | Format-Table Name
          
          # Use absolute paths for compilation
          $absScript = Join-Path $scriptDir $scriptName
          $arguments = @('/in', $absScript, '/out', $outFile, '/base', $base, '/ahk', $base, '/icon', $iconPath, '/silent')
          Write-Host "Running from: $scriptDir"
          Write-Host "Running: $compiler $($arguments -join ' ')"
          
          # Simple invocation without stream redirection to avoid hanging
          $output = & $compiler @arguments 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          
          Pop-Location
          
          Write-Host "Compiler output:"
          Write-Host $output
          Write-Host "Exit code: $exitCode"
          
          if ($null -eq $exitCode) {
            $exitCode = 0
          }
          if ($exitCode -ne 0) {
            throw "Ahk2Exe exited with code $exitCode"
          }
          
          # Wait for file system to flush
          Start-Sleep -Seconds 2
          
          if (-not (Test-Path $outFile)) {
            Write-Host "Listing dist directory:"
            Get-ChildItem $outDir -Recurse
            throw "Expected output missing: $outFile"
          }
          
          Write-Host "Successfully created: $outFile"
          $fileInfo = Get-Item $outFile
          Write-Host "Size: $($fileInfo.Length) bytes"

      - name: Compile LabStation
        shell: powershell
        run: |
          $compiler = "${{ steps.setup-tools.outputs.compiler }}"
          if (-not $compiler -or -not (Test-Path $compiler)) {
            throw "Ahk2Exe compiler path missing: $compiler"
          }
          $base = "${{ steps.setup-tools.outputs.autohotkey_base }}"
          if (-not $base -or -not (Test-Path $base)) {
            throw "AutoHotkey base path missing: $base"
          }

          $scriptPath = (Resolve-Path 'labstation/LabStation.ahk').Path
          $outDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outFile = Join-Path $outDir 'LabStation.exe'
          $iconPath = (Resolve-Path 'img/favicon.ico').Path
          Write-Host "Compiler: $compiler"
          Write-Host "Base: $base"
          Write-Host "Icon: $iconPath"
          Write-Host "Script: $scriptPath"
          Write-Host "Output: $outFile"

          # Verify script exists and is readable
          if (-not (Test-Path $scriptPath)) {
            throw "Script not found: $scriptPath"
          }
          Write-Host "Script verified, size: $((Get-Item $scriptPath).Length) bytes"

          # Change to script directory for compilation (required for relative includes)
          $scriptDir = Split-Path -Parent $scriptPath
          $scriptName = Split-Path -Leaf $scriptPath
          Push-Location $scriptDir
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Files in current directory:"
          Get-ChildItem | Select-Object -First 10 | Format-Table Name
          
          # Use absolute paths for compilation
          $absScript = Join-Path $scriptDir $scriptName
          $arguments = @('/in', $absScript, '/out', $outFile, '/base', $base, '/ahk', $base, '/icon', $iconPath, '/silent')
          Write-Host "Running from: $scriptDir"
          Write-Host "Running: $compiler $($arguments -join ' ')"
          
          # Simple invocation without stream redirection to avoid hanging
          $output = & $compiler @arguments 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          
          Pop-Location
          
          Write-Host "Compiler output:"
          Write-Host $output
          Write-Host "Exit code: $exitCode"

          if ($null -eq $exitCode) {
            $exitCode = 0
          }
          if ($exitCode -ne 0) {
            throw "Ahk2Exe exited with code $exitCode"
          }

          Start-Sleep -Seconds 2

          if (-not (Test-Path $outFile)) {
            Write-Host "Listing dist directory:"
            Get-ChildItem $outDir -Recurse
            throw "Expected output missing: $outFile"
          }

          Write-Host "Successfully created: $outFile"
          $fileInfo = Get-Item $outFile
          Write-Host "Size: $($fileInfo.Length) bytes"

      - name: Compile LabStation Panel
        shell: powershell
        run: |
          $compiler = "${{ steps.setup-tools.outputs.compiler }}"
          if (-not $compiler -or -not (Test-Path $compiler)) {
            throw "Ahk2Exe compiler path missing: $compiler"
          }
          $base = "${{ steps.setup-tools.outputs.autohotkey_base }}"
          if (-not $base -or -not (Test-Path $base)) {
            throw "AutoHotkey base path missing: $base"
          }

          $scriptPath = (Resolve-Path 'LabStationPanel.ahk').Path
          $outDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outFile = Join-Path $outDir 'LabStationPanel.exe'
          $iconPath = (Resolve-Path 'img/favicon.ico').Path
          Write-Host "Compiler: $compiler"
          Write-Host "Base: $base"
          Write-Host "Icon: $iconPath"
          Write-Host "Script: $scriptPath"
          Write-Host "Output: $outFile"
          
          # Verify script exists and is readable
          if (-not (Test-Path $scriptPath)) {
            throw "Script not found: $scriptPath"
          }
          Write-Host "Script verified, size: $((Get-Item $scriptPath).Length) bytes"
          
          # Use absolute paths for compilation
          $arguments = @('/in', $scriptPath, '/out', $outFile, '/base', $base, '/ahk', $base, '/icon', $iconPath, '/silent')
          Write-Host "Running: $compiler $($arguments -join ' ')"
          
          # Simple invocation without stream redirection to avoid hanging
          $output = & $compiler @arguments 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          
          Write-Host "Compiler output:"
          Write-Host $output
          Write-Host "Exit code: $exitCode"

          if ($null -eq $exitCode) {
            $exitCode = 0
          }
          if ($exitCode -ne 0) {
            throw "Ahk2Exe exited with code $exitCode"
          }

          Start-Sleep -Seconds 2

          if (-not (Test-Path $outFile)) {
            Write-Host "Listing dist directory:"
            Get-ChildItem $outDir -Recurse
            throw "Expected output missing: $outFile"
          }

          Write-Host "Successfully created: $outFile"
          $fileInfo = Get-Item $outFile
          Write-Host "Size: $($fileInfo.Length) bytes"

      - name: Stage WindowSpy helper
        shell: powershell
        run: |
          $source = Join-Path $PWD 'WindowSpy.exe'
          if (-not (Test-Path $source)) {
            throw "WindowSpy.exe not found at $source"
          }
          $destDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $destFile = Join-Path $destDir 'WindowSpy.exe'
          Copy-Item -Path $source -Destination $destFile -Force

      - name: Stage assets (logo)
        shell: powershell
        run: |
          $destDir = Join-Path $PWD 'dist'
          $logoDir = Join-Path $destDir 'img'
          New-Item -ItemType Directory -Force -Path $logoDir | Out-Null
          $logo = Join-Path $PWD 'img/DecentraLabs.png'
          if (Test-Path $logo) {
            Copy-Item -Path $logo -Destination (Join-Path $logoDir 'DecentraLabs.png') -Force
          } else {
            Write-Host "Logo not found at $logo; continuing without it."
          }

      - name: Validate embedded scripts in release executables
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Stop-ProcessesForPath($exePath) {
            $fullPath = (Resolve-Path $exePath).Path
            $processName = Split-Path $fullPath -Leaf
            Get-CimInstance Win32_Process -Filter "Name='$processName'" -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -eq $fullPath } |
              ForEach-Object {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }
          }

          function Assert-EmbeddedScript($exePath) {
            if (-not (Test-Path $exePath)) {
              throw "Executable missing: $exePath"
            }

            $name = Split-Path $exePath -Leaf
            $stdoutPath = "$exePath.stdout.txt"
            $stderrPath = "$exePath.stderr.txt"
            if (Test-Path $stdoutPath) { Remove-Item $stdoutPath -Force }
            if (Test-Path $stderrPath) { Remove-Item $stderrPath -Force }

            try {
              $proc = Start-Process -FilePath $exePath -ArgumentList '/ErrorStdOut' -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
              try {
                Wait-Process -Id $proc.Id -Timeout 8 -ErrorAction Stop
              } catch {
              }
            } finally {
              if ($proc) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
              Stop-ProcessesForPath $exePath
            }

            $stderr = ''
            if (Test-Path $stderrPath) {
              $stderr = Get-Content $stderrPath -Raw
            }

            if ($stderr -match 'Script file not found') {
              throw "${name} is missing embedded script payload. STDERR: $stderr"
            }
          }

          Assert-EmbeddedScript (Join-Path $PWD 'dist/LabStation.exe')
          Assert-EmbeddedScript (Join-Path $PWD 'dist/LabStationPanel.exe')
          Stop-ProcessesForPath (Join-Path $PWD 'dist/LabStation.exe')
          Stop-ProcessesForPath (Join-Path $PWD 'dist/LabStationPanel.exe')

      - name: Prepare executables for SignPath
        shell: powershell
        run: |
          $inputDir = Join-Path $PWD 'signing-input'
          New-Item -ItemType Directory -Force -Path $inputDir | Out-Null

          foreach ($name in @(
            'AppControl.exe',
            'LabStation.exe',
            'LabStationPanel.exe'
          )) {
            $source = Join-Path $PWD "dist/$name"
            if (-not (Test-Path $source)) {
              throw "Executable not found: $source"
            }

            Copy-Item -Path $source -Destination (Join-Path $inputDir $name) -Force
          }

      - name: Validate SignPath configuration
        shell: powershell
        run: |
          $policySlug = ([string]$env:SIGNPATH_SIGNING_POLICY_SLUG).Trim()
          if ([string]::IsNullOrWhiteSpace($policySlug)) {
            throw 'Repository variable SIGNPATH_SIGNING_POLICY_SLUG is missing'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw 'Repository secret SIGNPATH_API_TOKEN is missing'
          }
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

      - name: Install SignPath PowerShell module
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name SignPath -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          Import-Module SignPath -Force

      - name: Sign executables with SignPath PowerShell integration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module SignPath -Force

          $inputDir = Join-Path $PWD 'signing-input'
          $inputArtifact = Join-Path $PWD 'Lab-Station-signing-input.zip'
          $signedArtifact = Join-Path $PWD 'Lab-Station-signing-output.zip'
          $signedDir = Join-Path $PWD 'signed-artifact'
          $files = Get-ChildItem -LiteralPath $inputDir -File

          if ($files.Count -ne 3) {
            throw "Expected 3 executables in $inputDir, found $($files.Count)"
          }

          Compress-Archive -Path $files.FullName -DestinationPath $inputArtifact -Force
          New-Item -ItemType Directory -Force -Path $signedDir | Out-Null

          Submit-SigningRequest `
            -InputArtifactPath $inputArtifact `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -OrganizationId '50ce8c7b-c57f-406f-82bf-8b067125ed55' `
            -ProjectSlug 'Lab_Station' `
            -SigningPolicySlug $env:SIGNPATH_SIGNING_POLICY_SLUG `
            -OutputArtifactPath $signedArtifact `
            -WaitForCompletion `
            -Force

          Expand-Archive -LiteralPath $signedArtifact -DestinationPath $signedDir -Force
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

      - name: Replace release files with signed executables
        shell: powershell
        run: |
          $expected = @(
            'AppControl.exe',
            'LabStation.exe',
            'LabStationPanel.exe'
          )

          foreach ($name in $expected) {
            $signed = Get-ChildItem -Path 'signed-artifact' -Recurse -File |
              Where-Object { $_.Name -eq $name } |
              Select-Object -First 1

            if (-not $signed) {
              throw "Signed artifact not found: $name"
            }

            $destination = Join-Path $PWD "dist/$name"
            Copy-Item -Path $signed.FullName -Destination $destination -Force

            $signature = Get-AuthenticodeSignature -FilePath $destination
            if (-not $signature.SignerCertificate) {
              throw "$name does not contain an Authenticode signature"
            }

            Write-Host "$name signed: $($signature.Status)"
          }

      - name: Upload AppControl artifact
        uses: actions/upload-artifact@v7
        with:
          name: AppControl
          path: dist/AppControl.exe

      - name: Upload LabStation executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: LabStation-exe
          path: dist/LabStation.exe

      - name: Upload LabStation Panel artifact
        uses: actions/upload-artifact@v7
        with:
          name: LabStationPanel
          path: dist/LabStationPanel.exe

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: LabStation-assets
          path: dist/img/DecentraLabs.png

      - name: Upload WindowSpy artifact
        uses: actions/upload-artifact@v7
        with:
          name: WindowSpy
          path: dist/WindowSpy.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/AppControl.exe
            dist/LabStation.exe
            dist/LabStationPanel.exe
            dist/WindowSpy.exe
            dist/img/DecentraLabs.png
          tag_name: ${{ steps.release_meta.outputs.tag }}
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
