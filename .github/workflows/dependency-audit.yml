name: FMU dependency audit

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read pinned FMU Executor commit
        id: fmu-pin
        shell: pwsh
        run: |
          $lock = Get-Content fmu-executor/SOURCE.lock.json -Raw | ConvertFrom-Json
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned FMU Executor source
        uses: actions/checkout@v7
        with:
          repository: DecentraLabsCom/FMU-Executor
          ref: ${{ steps.fmu-pin.outputs.commit }}
          path: .fmu-executor-source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit the bundled FMU Executor dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .fmu-executor-source/requirements.txt
