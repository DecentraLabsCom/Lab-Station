name: FMU dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit the bundled FMU Executor dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: fmu-executor/requirements.txt
